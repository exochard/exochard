<svg viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">Self-hosting stack schematic</title>
  <desc id="d">Browser through a reverse proxy to an app and a database, with a branch to nightly backup.</desc>
  <style>
    text {
      font-family: "Barlow Condensed", "Arial Narrow", Oswald, sans-serif;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      fill: #1d1f20;
    }
    .label { font-size: 11px; }
    .plate-label { font-size: 9px; fill: rgba(29,31,32,0.55); }
    .node-box { fill: #f2f2f3; stroke: rgba(29,31,32,0.4); stroke-width: 1; }
    .corner { stroke: rgba(89,128,166,0.7); stroke-width: 1; }
    .connector {
      fill: none;
      stroke: #5980a6;
      stroke-width: 1.5;
      stroke-dasharray: var(--len);
      stroke-dashoffset: var(--len);
      animation: draw 0.7s ease-out var(--delay) forwards;
    }
    .arrow { fill: #5980a6; opacity: 0; animation: fade 0.2s ease-out calc(var(--delay) + 0.6s) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .connector { animation: none; stroke-dashoffset: 0; }
      .arrow { animation: none; opacity: 1; }
    }
  </style>

  <rect x="0" y="0" width="760" height="220" fill="#f2f2f3"/>
  <rect x="0.5" y="0.5" width="759" height="219" fill="none" stroke="rgba(29,31,32,0.16)"/>
  <text x="14" y="18" class="plate-label">how it's put together, not a live status board</text>

  <!-- connectors (drawn first, under nodes) -->
  <!-- browser -> caddy -->
  <path class="connector" style="--len:70; --delay:0s" d="M 150 92 H 220"/>
  <polygon class="arrow" style="--delay:0s" points="220,92 212,88 212,96"/>
  <!-- caddy -> app -->
  <path class="connector" style="--len:70; --delay:0.5s" d="M 340 92 H 410"/>
  <polygon class="arrow" style="--delay:0.5s" points="410,92 402,88 402,96"/>
  <!-- app -> postgres -->
  <path class="connector" style="--len:70; --delay:1.0s" d="M 530 92 H 600"/>
  <polygon class="arrow" style="--delay:1.0s" points="600,92 592,88 592,96"/>
  <!-- postgres -> backup -->
  <path class="connector" style="--len:46; --delay:1.5s" d="M 665 114 V 160"/>
  <polygon class="arrow" style="--delay:1.5s" points="665,160 661,152 669,152"/>

  <!-- node: browser -->
  <g>
    <rect class="node-box" x="40" y="70" width="110" height="44"/>
    <line class="corner" x1="34" y1="64" x2="34" y2="75"/>
    <line class="corner" x1="34" y1="69" x2="45" y2="69"/>
    <line class="corner" x1="156" y1="109" x2="156" y2="120"/>
    <line class="corner" x1="145" y1="115" x2="156" y2="115"/>
    <text x="95" y="96" text-anchor="middle" class="label">browser</text>
  </g>

  <!-- node: caddy -->
  <g>
    <rect class="node-box" x="230" y="70" width="110" height="44"/>
    <line class="corner" x1="224" y1="64" x2="224" y2="75"/>
    <line class="corner" x1="224" y1="69" x2="235" y2="69"/>
    <line class="corner" x1="346" y1="109" x2="346" y2="120"/>
    <line class="corner" x1="335" y1="115" x2="346" y2="115"/>
    <text x="285" y="90" text-anchor="middle" class="label">caddy</text>
    <text x="285" y="103" text-anchor="middle" class="label">reverse proxy · tls</text>
  </g>

  <!-- node: app -->
  <g>
    <rect class="node-box" x="420" y="70" width="110" height="44"/>
    <line class="corner" x1="414" y1="64" x2="414" y2="75"/>
    <line class="corner" x1="414" y1="69" x2="425" y2="69"/>
    <line class="corner" x1="536" y1="109" x2="536" y2="120"/>
    <line class="corner" x1="525" y1="115" x2="536" y2="115"/>
    <text x="475" y="96" text-anchor="middle" class="label">app</text>
  </g>

  <!-- node: postgres -->
  <g>
    <rect class="node-box" x="610" y="70" width="110" height="44"/>
    <line class="corner" x1="604" y1="64" x2="604" y2="75"/>
    <line class="corner" x1="604" y1="69" x2="615" y2="69"/>
    <line class="corner" x1="726" y1="109" x2="726" y2="120"/>
    <line class="corner" x1="715" y1="115" x2="726" y2="115"/>
    <text x="665" y="96" text-anchor="middle" class="label">postgres</text>
  </g>

  <!-- node: backup -->
  <g>
    <rect class="node-box" x="610" y="160" width="110" height="40"/>
    <line class="corner" x1="604" y1="154" x2="604" y2="165"/>
    <line class="corner" x1="604" y1="159" x2="615" y2="159"/>
    <line class="corner" x1="726" y1="195" x2="726" y2="206"/>
    <line class="corner" x1="715" y1="201" x2="726" y2="201"/>
    <text x="665" y="184" text-anchor="middle" class="label">nightly backup</text>
  </g>
</svg>
