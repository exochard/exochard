<text class="b row" style="animation-delay:2.76s" x="36" y="160" textLength="1128" lengthAdjust="spacing" xml:space="preserve">██      ██    ██  ██    ██      ██  ██          ████    ██          ██  ████    ██  ██    ████</text>
<text class="b row" style="animation-delay:3.08s" x="36" y="180" textLength="1128" lengthAdjust="spacing" xml:space="preserve">██████████      ██      ██      ██  ██          ██      ██    ████████  ██          ██      ██</text>
<text class="b row" style="animation-delay:3.40s" x="36" y="200" textLength="1128" lengthAdjust="spacing" xml:space="preserve">██            ██  ██    ██      ██  ██          ██      ██  ██      ██  ██          ██    ████</text>
<text class="b row" style="animation-delay:3.72s" x="36" y="220" textLength="1128" lengthAdjust="spacing" xml:space="preserve">  ████████  ██      ██    ██████      ████████  ██      ██    ████████  ██            ████  ██</text>
<rect class="scan" x="26" y="98" width="1148" height="2" fill="#1a7f37"/>
<text class="p late" x="36" y="268" xml:space="preserve"><tspan class="a">$</tspan> <tspan class="a cur">█</tspan></text>
</svg>